# Hand-curated institution tiers.
#
# This file is the authority: `seed_catalog` writes reputation_source="curated"
# for everything here, and a later bulk import refuses to overwrite that. Bulk
# sources fill in the long tail at tier 9 (UNRANKED); this file supplies the
# judgement calls.
#
# Tiers: 1 elite, 2 strong, 3 standard, 4 basic. See ReputationTier.
#
# QS and THE rankings are NOT redistributable, so international tiers here are
# our own editorial judgement based on general recognition, not a copied table.
# Indian tiers follow NIRF rank bands, which are published openly.

