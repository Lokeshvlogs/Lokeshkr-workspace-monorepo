# Hand-curated employers, with the domains a work-email check will need.
#
# `profession_tags` uses the values from the frontend `professionOptions` list.
# An empty or absent list means the employer is offered for every profession,
# which is right for large conglomerates that hire across the board.
#
# Tiers here mean employer recognisability, not desirability as a workplace.

